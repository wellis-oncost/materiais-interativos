name: Deploy Materiais Interativos to GitHub Pages

# Publicação v1.0.1 — reconstrói a base v1.0.0 validada e aplica o hotfix pós-lançamento.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild base package and apply v1.0.1 hotfix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _build _site
          cat \
            deploy_parts/part-00.b64 \
            deploy_parts/part-01.b64 \
            deploy_parts/part-02a.b64 \
            deploy_parts/part-02b.b64 \
            deploy_parts/part-02c.b64 \
            deploy_parts/part-02d.b64 \
            deploy_parts/part-03.b64 \
            deploy_parts/part-04.b64 \
            deploy_parts/part-05.b64 \
            deploy_parts/part-06.b64 \
            deploy_parts/part-07.b64 \
            deploy_parts/part-08.b64 \
            deploy_parts/part-09.b64 \
            > _build/package.b64
          base64 --decode _build/package.b64 > _build/package.zip
          echo "cf81b83ad562707e9d9308c88a673c5f7d2960364bbf2dc217a42599a315be03  _build/package.zip" | sha256sum -c -
          unzip -q _build/package.zip -d _build/unpacked
          cp -a _build/unpacked/materiais-interativos-publicacao-v1.0.0/. _site/
          rm -rf _site/.github
          rm -f _site/DEPLOY_INFO.txt _site/PUBLICACAO_GITHUB_PAGES.txt

          base64 --decode hotfix-v1.0.1.patch.gz.b64 | gzip -dc > _build/hotfix-v1.0.1.patch
          patch -p1 -d _site < _build/hotfix-v1.0.1.patch
          grep -q 'v1.0.1 · local-first' _site/index.html
          grep -q 'materiais-interativos-v1-0-1' _site/sw.js
          grep -q 'importAnswerKeyFile' _site/js/app.js

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
